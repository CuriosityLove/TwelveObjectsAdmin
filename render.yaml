# Render Blueprint: the app and its database.
# In Render: New > Blueprint > pick this repository. Fill in the values marked sync: false.
databases:
  - name: twelve-objects-db
    databaseName: twelve_objects
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: twelve-objects-admin
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      - admin.twelveobjects.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: twelve-objects-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://admin.twelveobjects.com
      - key: ALLOWED_DOMAIN
        value: twelveobjects.com
      - key: ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
